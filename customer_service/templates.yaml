# -*- coding: utf-8 -*-
# 话术模板库（v2.0 话术体系扩展版）
# 结构：
#   top-level 分类（bargain/complain/consult/chat）→ LLM 意图识别兜底用
#   hot_questions → 关键词前置命中（8大类50+场景，约100个模板）
# 渲染：jinja2 变量替换 + 随机池抽取
# 变量名与 shop_config.yaml 严格对应，嵌套对象用点号访问

# ==================== LLM 兜底模板（保留原有4分类） ====================
# 关键词没命中时，LLM 识别意图后从这里随机选

bargain:
  - 您看，咱家{{board_brand}}加{{edge_band}}，这价真不虚高。这样，我给您申请{{concessions}}，{{urgency}}，等于变相让利了，您看行不？
  - 价格好商量，但材料我不敢含糊——{{selling_point}}。您定下来我给您走内部价，再送{{concessions}}，{{warranty}}。
  - 实话说利润真不多，咱做的是口碑。您诚心要，我把{{concessions}}给您加上，{{urgency}}，这已经是我能做的最大让步了。

complain:
  - 您说贵我理解，但咱家{{selling_point}}，一分钱一分货。便宜的板材甲醛超标，住着才糟心。
  - 比价我不怕——{{selling_point}}。您把对方报价发我，我一项项给您拆开算，谁实在一目了然。
  - 贵有贵的道理——{{selling_point}}，同行有几家敢承诺？出了问题随叫随到，这才是省心钱。

consult:
  - 咱家主材{{board_brand}}，封边{{edge_band}}，五金{{hardware_brand}}，都是行业里叫得上号的，环保和耐用都有保障。
  - 放心，主材{{board_brand}}、封边{{edge_band}}、五金{{hardware_brand}}，配置我都给您写进合同，白纸黑字，用别的料您找我。

chat:
  reject:
    - 应该的，定制是大事，多比比更放心。您慢慢考虑，有任何问题随时问我，不催您。
    - 理解，回去跟家里商量商量。我把方案和报价整理好发您，您对比着看，觉得合适咱再聊。
  background:
    - 咱{{shop_name}}在{{city}}做了{{years_in_business}}年了，店就在{{shop_location}}，老板{{boss_name}}亲自把关工艺，您有空可以来店里看看实样。
    - 我们是{{city}}本地老店，{{years_in_business}}年口碑，老板{{boss_name}}是老木工出身。地址{{shop_location}}，欢迎随时来店里坐坐。
  casual:
    - 哈哈您还挺懂行，行情确实有波动。不过咱进货量大价格稳，不会乱涨，您这时候定正合适——{{urgency}}。
    - 这行看着热闹，其实拼的是手艺和售后。咱不赚快钱，靠的是{{selling_point}}，慢慢做回头客。
  soft_end:
    - 咱也聊了不少啦，要不这样，我先把{{board_brand}}的方案和报价给您发过去，您得空看看，随时找我，我随时在。
    - 不打扰您太多，需求您先琢磨着。我把{{concessions}}的活动给您留着，等您定了招呼一声就行，我这边随时安排。

# ==================== 知识盲区兜底模板 ====================
# 触发条件：连续多轮走LLM兜底 / 偏门开放式问题答不上来
# 核心策略：诚实承认不懂 + 引导加微信转人工

unknown_question:
  # 俏皮承认型
  - "哎呀呀老板，您问的这个问题有点小深度，把我给难住了……我就是个客服小姑娘，专业的事得专业的人来。要不您加我微信{{wechat_id}}，我把我们设计师的联系方式发您，他比我懂行多了，您想问啥都行～"
  - "嘿嘿，您这问题问得好，我还真答不上来……我这小脑瓜里装的都是基础问题，太深的得喊救兵了。您留个联系方式呗？我让我们老板亲自给您回，保证给您讲得明明白白的！"
  # 真诚实在型
  - "不好意思，这个我确实不太确定，不敢瞎跟您说，怕给您说错了误导您。这样吧，您加我微信{{wechat_id}}，我让设计师给您详细解答，他做这行十几年了，什么情况都遇见过。"
  - "您这个问题挺专业的，我得跟厂里确认一下才敢答复您。要不您留个联系方式，我问清楚了第一时间给您回电话？"
  # 幽默自嘲型
  - "哈哈哈，被您问住了！不瞒您说，我就是个半吊子客服，太专业的我得搬救兵。您加我微信{{wechat_id}}，我把我们技术大神喊来跟您聊，保证您问啥他都能答上来～"
  - "哎呀这题超纲了！我脑子里的知识库就到这儿了……您要是不嫌麻烦，加我微信{{wechat_id}}，我让我们工程师给您解答，他懂的比我多十倍。"
  # 顺势引导型
  - "您这个问题问得特别好，说明您是真懂行的。这个得结合您家的具体情况来聊，一两句话说不清楚。您加我微信{{wechat_id}}，我让设计师给您一对一详细解答，比在这干聊有用多了。"

# ==================== 高频问题关键词命中（hot_questions） ====================
# 优先级最高，不走 LLM，精准匹配
# 每条结构：{keywords: [...], templates: [...]}

hot_questions:

  # ================ 一、议价体系（9个场景） ================

  # 0.1 报价格区间（议价状态机专用 Step 0→1）
  - category: bargain_price_range
    bargain_only: true
    keywords: []
    templates:
      - "咱这价格从{{price_range_low}}到{{price_range_high}}一平都有，主要看材料。{{materials_list}}，您主要关注环保还是性价比？我给您推荐合适的。"
      - "价格多少主要看您选啥材料，颗粒板最便宜，实木最贵。您家用在哪个房间？不同地方选的材料不一样。"
      - "一平方{{price_range_low}}到{{price_range_high}}不等，有颗粒板、多层板、生态板、实木板好几种。您有什么偏好吗？我给您推荐最适合的。"

  # 0.2 选定材料后的实价（议价状态机专用 Step 1→2）
  - category: bargain_material_price
    bargain_only: true
    keywords: []
    templates:
      - "{{material_name}}的话是{{material_price}}一平，{{price_method}}计算。标配{{hardware}}五金、{{edge_band}}封边，环保等级都是达标的，您放心。"
      - "{{material_name}}一平{{material_price}}，按{{price_method}}算。五金用的{{hardware}}，封边是{{edge_band}}，这配置在同价位里很能打了。"
      - "您选的{{material_name}}是{{material_price}}一平，计价方式是{{price_method}}。标配{{hardware}}，封边{{edge_band}}，您看这配置行吗？"

  # 0.3 拉回正题话术（议价各阶段通用，按step选用）
  - category: bargain_pullback
    bargain_only: true
    keywords: []
    templates:
      - "对了，您这边大概想用什么材料？我好给您报准确价格。"
      - "您看这个配置行吗？合适的话我给您算下具体报价。"
      - "对了，您大概做多少平呀？我好给您申请最合适的优惠。"
      - "您看这个价位合适不？合适的话咱可以安排免费量房。"

  # 0.4 引导加微信留资（议价流程最终兜底）
  - category: bargain_lead_wechat
    bargain_only: true
    keywords: []
    templates:
      - "这一句两句也说不清楚，您加我微信{{wechat_id}}吧，我把详细报价单和案例都发您看看。"
      - "您加我微信{{wechat_id}}聊吧，微信上说方便，有什么问题随时问我。"
      - "要不您加我微信{{wechat_id}}？我让设计师跟您对接，免费给您出个方案和报价。"

  # 1.1 议价第一步：反问摸底（议价状态机专用）
  - category: bargain_probe
    bargain_only: true
    keywords:
      - 便宜
      - 优惠
      - 打折
      - 最低价
      - 能不能少
      - 砍价
      - 再便宜点
      - 太贵了
      - 价格高
      - 有没有优惠
      - 能便宜吗
      - 便宜点
      - 少点
      - 能不能优惠
    templates:
      - "价格好说，主要看您需求。您大概做几个柜子呀？我好给您报个实在价。"
      - "咱这都是实价不忽悠，您先说说大概多少平、做几个柜子，我给您算个精准的，比在这瞎砍有用。"
      - "价格这块我肯定不让您吃亏，但您得先告诉我做多大、什么风格，我才能给您申请到最合适的优惠。"

  # 1.2 小单应对（1-2个柜子）：议价状态机专用
  - category: bargain_small
    bargain_only: true
    keywords:
      - 就一个衣柜
      - 就做一个
      - 一个柜子
      - 两个柜子
      - 就鞋柜
      - 就一个
      - 一二个
      - 一两个柜子
      - 只做一个
      - 就一个柜子
    templates:
      # 1. 内部价套路
      - "{{order_desc}}的话我给您申请个内部员工价，再送{{concessions}}。虽然单小，但该给的优惠我一样不少，您看行吗？"
      # 2. 走量价套路
      - "实话跟您说，小单子真没什么利润空间。这样吧，{{order_desc}}我给您走个量价，再送{{concessions}}，就当帮我凑个单了。"
      # 3. 老板申请套路
      - "{{order_desc}}我本来做不了主的，您要真心想要，我去跟{{boss_name}}申请个特批价，再给您加上{{concessions}}。您加我微信{{wechat_id}}，申请下来我第一时间告诉您。"
      # 4. 活动期限套路
      - "赶上了您，这个月我们冲量做活动，{{order_desc}}也能享受优惠价，还送{{concessions}}。月底就结束了，要定抓紧。"
      # 5. 送东西套路
      - "价钱真的不能再低了，小单子利润薄。这样，我给您送{{concessions}}，{{order_desc}}也不差这点东西，主要是个心意，您看行不？"
      # 6. 组合优惠套路
      - "行吧，{{order_desc}}我给您来个组合优惠：直减一点 + 送{{concessions}} + 免费升级{{edge_band}}封边。这真的是我能做的最大让步了。"

  # 1.3 中单应对（6-29平 / 3-5个柜子）：议价状态机专用
  - category: bargain_medium
    bargain_only: true
    keywords:
      - 三个柜子
      - 四个柜子
      - 五个柜子
      - 三四个
      - 四五个
      - 几个柜子
      - 两三
      - 三四
      - 四五
      - 3个
      - 4个
      - 5个
    templates:
      # 1. 内部价套路
      - "{{order_desc}}的话我给您申请个内部价，再送{{concessions}}。{{urgency}}，您这时候定正合适。"
      # 2. 团购价套路
      - "这个量我给您走团购价，再送{{concessions}}。说实话利润真的不多，主要{{urgency}}，走个量。"
      # 3. 老板申请套路
      - "{{order_desc}}我去跟{{boss_name}}申请个特批价，再给您送{{concessions}}。老板手里权限大，肯定比我给的优惠多。您加我微信{{wechat_id}}，申请好我让老板直接跟您说。"
      # 4. 活动期限套路
      - "您赶巧了，这个月厂家有返点活动，{{order_desc}}能省不少钱，还送{{concessions}}。月底就恢复原价了，要定抓紧。"
      # 5. 送东西套路
      - "价钱真的到底了，这样吧，我给您送{{concessions}}，再免费升级一下五金。{{order_desc}}算下来也值不少钱呢。"
      # 6. 组合优惠套路
      - "行，{{order_desc}}我给您申请最大力度：直降一个点 + 送{{concessions}} + 免费升级封边。{{urgency}}，过了这村没这店了。"

  # 1.4 大单应对（≥30平 / 全屋定制）：议价状态机专用
  - category: bargain_large
    bargain_only: true
    keywords:
      - 全屋
      - 整体
      - 全部
      - 整套
      - 所有房间
      - 全屋定制
      - 整套房子
      - 全房
      - 所有柜子
      - 全部做
    templates:
      # 1. 老板申请套路
      - "{{order_desc}}的话那好说，价格肯定有优惠空间。这样，您加我微信{{wechat_id}}，我让{{boss_name}}亲自跟您谈，老板手里权限大。"
      # 2. 团购/量大价套路
      - "{{order_desc}}量大，我们肯定给最优惠的价，走的是工程价。{{hook}}，我把方案和详细报价单给您发过去，您一看就明白。"
      # 3. 老板特批套路
      - "{{order_desc}}我做不了主，得找{{boss_name}}批。您留个联系方式，我让老板直接跟您谈，保证给您个惊喜价。"
      # 4. 活动期限套路
      - "您赶巧了，这个月我们做大单专项活动，{{order_desc}}额外再降2个点，还送全屋{{concessions}}。月底就结束了。"
      # 5. 送东西+升级套路
      - "{{order_desc}}我们肯定重视，价格、服务都是顶配。五金全给您升级成{{hardware_brand}}的，再送全屋{{concessions}}。{{hook}}，我给您安排免费量房+出方案。"
      # 6. 组合优惠套路
      - "行，{{order_desc}}我给您来个一步到位：直降两个点 + 送{{concessions}} + 五金全升级 + 免费量房设计。这力度平时想都别想，您得保密。"

  # 1.5 砍价升级：议价状态机专用
  - category: bargain_upgrade
    bargain_only: true
    keywords:
      - 再便宜点
      - 还能少吗
      - 能不能再优惠
      - 太贵了
      - 还是贵
      - 再降点
      - 再打个折
      - 再少点
      - 不够便宜
      - 还是高
    templates:
      - "我真的已经尽力了。这样吧，我跟{{boss_name}}申请一下，看老板能不能给个特殊价。您{{hook}}，我申请好直接发您。"
      - "这个价我真的做不了主了。要不我让设计师跟您对接，看方案上能不能优化一下，既能满足需求又能省点钱。{{hook}}？"
      - "实话说我权限就这么大了。您要真心想要，我找{{boss_name}}给您批个员工价。您{{hook}}，我一会就给您回消息。"

  # 1.7 留资成功话术（检测到客户留联系方式时触发，最高优先级）
  - category: lead_capture_success
    keywords: []
    templates:
      - "好的收到，我记下了，一会就联系您。"
      - "好的，联系方式收到了，稍后给您回过去。"
      - "收到，您稍等，我马上安排人和您对接。"
      - "好嘞，已经记下来了，我们这边会尽快联系您的。"
      - "收到，您方便的话也可以加我微信{{wechat_id}}，我发点案例和报价单您先看看。"

  # 1.8 材料对比话术（LLM路由 material_compare 专用）
  - category: material_compare
    keywords:
      - 各有什么优缺点
      - 区别在哪
      - 哪个好
      - 怎么选
      - 对比一下
      - 差别
      - 有什么不一样
    templates:
      - "颗粒板性价比最高，适合预算有限的家庭；多层板防潮性好，厨房卫生间用更耐用；生态板最环保，有小孩或者孕妇的话强烈推荐。您主要用在哪个房间？"
      - "颗粒板便宜但怕潮，多层板结实防潮价格中等，生态板最环保但是贵一些。一分钱一分货，主要看您预算和需求。您看重哪方面？"
      - "常用的就这三种：颗粒板（性价比王）、多层板（防潮耐用）、生态板（环保首选）。您预算大概多少？我给您推荐最合适的。"

  # 1.8.5 场景化材料推荐（议价状态机 Step 1 场景识别专用）
  - category: material_recommend_kids_room
    keywords:
      - 儿童房
      - 小孩房
      - 宝宝房
      - 孩子房间
      - 儿童衣柜
      - 孩子用
    templates:
      - "儿童房我推荐您用生态板，这个是最环保的，都是实木芯子贴皮，胶用得少，甲醛释放量最低。孩子天天在里面待，健康最重要，多花点钱买个放心。颜色的话儿童房一般做浅色或者亮色，显得亮堂，孩子也喜欢，比如米白色、浅蓝、浅粉这些，不容易看腻。生态板是1199一平，投影面积计算。"

  - category: material_recommend_kitchen
    keywords:
      - 厨房
      - 橱柜
      - 厨柜
      - 厨房柜子
    templates:
      - "厨房我强烈推荐用多层板，厨房油烟大、水汽重，多层板防潮性最好，泡点水都不容易变形，用个十年八年没问题。颗粒板就不行了，吸潮容易膨胀。颜色选耐脏的，比如深灰、咖色、木纹色，溅点油点子看不出来，好打理。多层板是1099一平。"

  - category: material_recommend_bathroom
    keywords:
      - 卫生间
      - 阳台
      - 洗手间
      - 卫浴柜
      - 阳台柜
      - 洗衣柜
    templates:
      - "卫生间和阳台常年有水汽，材料一定要选防潮的。预算够的话用蜂窝铝最好，全铝的不怕水不发霉，就是价格高一些。预算有限就用多层板，比颗粒板防潮很多，用个五六年没问题。颜色选浅灰、白色这些清爽的，显得干净。多层板是1099一平。"

  - category: material_recommend_bedroom
    keywords:
      - 卧室
      - 主卧
      - 次卧
      - 衣柜
      - 大衣柜
      - 衣帽间
    templates:
      - "卧室衣柜用颗粒板或者生态板都行，看您预算。预算有限选颗粒板799的，性价比最高，正常用个十几年没问题。注重环保就选生态板1199的，实木芯更放心。颜色卧室一般选暖色调，浅胡桃、米白、奶油色这些，看着温馨，睡觉舒服。"

  - category: material_recommend_shoe_cabinet
    keywords:
      - 鞋柜
      - 餐边柜
      - 玄关柜
      - 酒柜
      - 门厅柜
    templates:
      - "鞋柜、餐边柜这些地方不像厨房卫生间那么潮，也不像卧室天天待，用颗粒板就足够了，性价比最高，799一平很划算。颜色主要跟您家装修风格搭就行，现代简约选白色灰色，中式选胡桃木色，北欧选浅木纹。"

