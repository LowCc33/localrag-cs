# 六、材料对比模板（替换公用material_compare）
# ============================================================
material_compare_templates:
  - "四种板材各有各的定位。SPC蜂窝板480最便宜，预算有限首选；全铝蜂窝板680性价比最高，家用最常用；全铝焊接大板980档次高，防潮耐用性最好；碳脂板1180是最新款，质感颜值顶级。您主要用在哪些地方？我帮您选最合适的。"
  - "简单说：追求性价比选全铝蜂窝板680，追求品质选焊接大板980，预算有限选SPC480，追求高端选碳脂板1180。都是捷定零甲醛的，只是材料结构和质感不一样。您做哪些地方的柜子？我给您参谋参谋。"
  - "四款都是捷定的零甲醛板材。区别主要在材质和质感：SPC是石塑材质最便宜，蜂窝板和焊接大板是全铝的，碳脂板是最新高端材料。家用一般全铝蜂窝板就够了，680一平性价比最高。您怎么看？"

# ============================================================
# 七、嫌贵/价值塑造模板（替换公用bargain_complain_value）
# ============================================================
value_building_templates:
  - "姐/哥，说实话全铝是比木质的贵，但是贵有贵的道理。第一，零甲醛，装完就能住，不用晾半年，这省了多少时间和房租？第二，防潮防火不变形，木质的用个五六年可能就变形发霉了，全铝的用二三十年都没问题，算下来其实更便宜。第三，我们是工厂直营，5000平厂房就在包河，比门店还便宜20%。您加我微信{{wechat_id}}，我发您看看实景案例，您对比一下就知道值不值了。"
  - "全铝确实比颗粒板贵，但是完全不是一个档次的东西。木质的再环保也是用胶粘的，多少都有甲醛，全铝的是真的零甲醛。而且木质的怕潮怕火怕变形，全铝的这些问题全没有。您算算，一套柜子用二三十年，平均一年才几百块，比木质的划算多了。您加我微信{{wechat_id}}，我给您发点实际案例您看看。"
  - "您不能光看单价呀。我们捷定的板子，零甲醛，悍高五金，激光封边，六面无缝工艺，这配置放木质定制里也得一千多一平。全铝的还防潮防火不变形，用的时间是木质的两三倍。您加我微信{{wechat_id}}，我给您算个详细报价，您看看合不合适。"

# ============================================================
# 八、全铝vs木质对比专用话术（客户必问）
# ============================================================
aluminum_vs_wood_templates:
  - "全铝和木质的主要区别在这几个方面：第一环保，全铝零甲醛，装完就能住，木质的多少都有胶，得晾；第二防潮，卫生间厨房阳台这些地方，木质的容易发霉变形，全铝的完全不怕水；第三耐用，木质的用5-10年可能就出问题，全铝的用二三十年都没问题；第四防火，全铝不燃，安全。当然全铝也有缺点，就是贵一点，但是算使用寿命的话其实更划算。您加我微信{{wechat_id}}，我发您看看实物图您就明白了。"

# ============================================================
# 九、环保/零甲醛话术（客户必问）
# ============================================================
eco_zero_formaldehyde_templates:
  - "零甲醛这个您放心，我们捷定的板材都是有检测报告的。全铝的材质本身就不含甲醛，不像木质板需要用胶粘合。装完当天就能住，对老人小孩孕妇都安全。很多客户就是因为刚装修完着急住，才选的全铝。您加我微信{{wechat_id}}，我把检测报告发您看看。"
  - "全铝家居最大的优势就是零甲醛。板材本身是铝合金的，不用胶粘合，所以完全没有甲醛释放。我们客户里很多都是刚结婚准备要孩子的，或者家里有小孩的，就是冲着环保来的。装完就能住，不用晾半年。您加我微信{{wechat_id}}，检测报告和案例我都发您看看。"

