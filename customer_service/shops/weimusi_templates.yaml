material_list_templates:
  - "SPC蜂窝板480、全铝蜂窝板680、全铝焊接大板980、碳脂板1180，一共四个档次，都是捷定零甲醛的。"

# ============================================================
# 三、材料选择检测（关键词组，跟配置里的keywords对应即可，不用重复写）
# 引擎从materials.boards[*].keywords读取，这里不用配置
# ============================================================

# ============================================================
# 四、Step 2 报实价模板（替换公用bargain_material_price）
# ============================================================
material_price_templates:
  - "{{material_name}}一平{{material_price}}，展开面积算。捷定品牌，零甲醛环保，标配悍高五金和激光封边。您看这配置行吗？"
