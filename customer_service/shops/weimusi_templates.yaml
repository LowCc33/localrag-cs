# ============================================================
price_inquiry_templates:
  - "一平方 480 到 1180 不等，按展开面积算，看您选哪种材料。有 SPC 蜂窝板、全铝蜂窝板、全铝焊接大板，还有高端的碳脂板，都是捷定品牌零甲醛的。我们主推的是焊接大板，卖得最多，口碑也最好。您主要看重性价比还是品质？做哪些地方的柜子？您跟我说说，我给您推荐最合适的。"
  - "我们家从 480 到 1180 一平都有，主要看材料，都是按展开面积算的，跟外面按投影算的不一样。追求性价比选全铝蜂窝板，680 一平，家用够用了；我们主推的是全铝焊接大板，980 一平，卖得最多，耐造质量好，口碑也最好，大部分客户都选这个。您主要做哪些柜子？看重性价比还是品质？我帮您推荐一下。"
  - "价格从 480 到 1180 一平方不等，展开面积算的，跟投影计价不一样，展开大概是投影的 2.5倍左右，这点提前跟您说清楚。四种板材都是捷定的，零甲醛，防潮防火不变形，跟木质板不是一个路子。我们主推焊接大板，耐造质量没得说；追求档次的话选碳脂板，质感比木质的还好。也有客户组合着做，柜体用焊接板，门板见光面用碳脂板，性价比和颜值都有了。您主要做哪些柜子？看重性价比还是品质？我帮您推荐最合适的。"

