# ============================================================
price_inquiry_templates:
  - "一平方480到1180不等，看你用哪种材料。有SPC蜂窝板、全铝蜂窝板、全铝焊接大板、还有高端的碳脂板，都是捷定品牌零甲醛的。您主要看重性价比还是品质？还有做哪些地方的柜子？您跟我说说，我给您推荐最合适的。"
  - "我们家从480一平到1180一平都有，主要看材料。SPC的最便宜，全铝蜂窝板性价比最高，焊接大板档次高，碳脂板是最新款。您预算大概什么范围？还有主要做哪些柜子？"
  - "价格从480到1180一平方不等，展开面积算。四种板材都是捷定的，零甲醛。您可以跟我说下您的需求，我给您报个实在价。"

