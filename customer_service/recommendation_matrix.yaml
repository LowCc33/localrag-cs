# 二维推荐矩阵配置
# 场景 × 偏好 → 推荐材料 + 推荐理由
# material 对应 shop_config.pricing 中的材料 key
# reason 是话术里的推荐理由（模板变量 {{recommend_reason}}）
# 以后改推荐策略只改这个文件，不用动代码

# 场景中文名映射（供检测函数返回 scene_name 用）
scene_names:
  bedroom_wardrobe: "卧室衣柜"
  kids_room: "儿童房"
  kitchen: "厨房"
  bathroom: "卫生间"
  balcony: "阳台"
  shoe_cabinet: "鞋柜"
  tatami: "榻榻米"
  living_room: "客厅"
  whole_house: "全屋"

# 偏好中文名映射
preference_names:
  cost_effective: "性价比"
  eco_friendly: "环保"
  balanced: "均衡"
  quality: "品质"
  recommend_me: "推荐"

# 场景化跟进提问（推荐完顺势问需求，推进转化）
scene_follow_up:
  bedroom_wardrobe: "您衣柜大概做多大？"
  kids_room: "您儿童房大概几个平方？"
  kitchen: "您厨房大概几米？"
  bathroom: "卫生间大概多大？"
  balcony: "阳台柜大概做多长？"
  shoe_cabinet: "您鞋柜大概做多大？"
  tatami: "大概做几个平方？"
  living_room: "您客厅柜子大概做多大？"
  whole_house: "您房子多大面积？"
  default: "您大概做几个柜子啊？"

# ========== 二维推荐矩阵主体 ==========
