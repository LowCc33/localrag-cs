# -*- coding: utf-8 -*-
# 商家配置文件（v2.0 话术体系扩展版）
# 职责：存放话术模板里需要填充的所有变量，供 engine.py 读取后用 jinja2 渲染
# 说明：模板里 {{变量名}} 会和这里的 key 一一对应
#       嵌套对象用点号访问，如 {{payment_terms.deposit}}

# ==================== 店铺基础信息 ====================
shop_name: 佳美全屋定制
boss_name: 王师傅
years_in_business: 15   # 从业年数
city: 杭州
shop_location: 杭州市余杭区建材市场三楼A区
wechat_id: "13800138000"   # 留资/兜底用的微信号
default_material: particle_board   # 默认材料

# ==================== 价格表（供议价状态机使用） ====================
_pricing:
  base_price_method: 投影面积
  particle_board_price: 899
  multi_layer_board_price: 1299
  osb_board_price: 1199
  ecological_board_price: 1399
  solid_wood_price: 1899

_base_price_method: 投影面积

# ==================== 产品/工艺硬参数 ====================
board_brand: 兔宝宝颗粒板ENF级   # 板材
edge_band: PUR封边              # 封边工艺
hardware_brand: DTC五金         # 五金品牌
eco_level: ENF级                # 环保等级

# ==================== 工艺能力配置 ====================
# 客户问某项工艺能不能做时，查这里判断走"能做"还是"替代方案"话术
# 全部为 bool 类型，商家根据自身能力修改
process_capability:
  arc_curved: true         # 圆弧工艺
  door_wall_cabinet: true  # 门墙柜一体
  hole_board: true         # 洞洞板
  wall_panel: true         # 护墙板
  interior_door: true      # 室内门
  glass_door: true         # 玻璃门
  aluminum_frame: true     # 铝框门
  ox_horn_handle: false    # 牛角拉手
  hidden_handle: true      # 隐藏拉手
  rebound_device: true     # 反弹器
  tatami: true             # 榻榻米
  open_kitchen: true       # 开放式厨房

# ==================== 付款方式配置 ====================
payment_terms:
  deposit: "50%"              # 定金比例
  production_pay: "45%"       # 生产前付款比例
  final_pay: "5%"             # 安装验收后尾款比例
  deposit_amount: "500"       # 测量定金金额（元）
  refundable: true            # 定金是否可退
  warranty_years: "5"         # 质保年限
  after_sales_phone: "400-888-6666"  # 售后电话

# ==================== 工期配置 ====================
production_cycle:
  design_days: "7"        # 设计周期（天）
  production_days: "30-45"  # 生产周期（天）
  install_days: "1-2"     # 安装周期（天）
  rush_available: true    # 是否可以加急
  rush_days: "25"         # 加急最快天数
  repair_days: "7"        # 补件周期（天）

# ==================== 品牌信任配置 ====================
trust_points:
  factory_location: "余杭区仓前工业园"   # 工厂地址
  factory_size: "占地10亩，3条生产线"     # 工厂规模
  # 做过的小区案例（列表，话术里随机抽一个说）
  community_cases:
    - "未来科技城"
    - "良渚文化村"
    - "闲林山水"
    - "西溪湿地"
  boss_is_local: true   # 老板是不是本地人

# ==================== 让利钩子池（每次随机抽 1 个用） ====================
concessions:
  - 全屋免费设计
  - 送价值1980的智能感应灯带
  - 送5平米背景墙
  - 厨房石英石台面升级

# ==================== 紧迫感因素池（每次随机抽 1 个用） ====================
urgency_factors:
  - 这次活动月底就结束
  - 厂家这个月有返点政策
  - 板材马上要涨价
  - 师傅档期快排满了

# ==================== 商家独有卖点池（挑刺/砍价时随机抽 1 个说，一次只说 1 个） ====================
selling_points:
  - 板材用的是兔宝宝的，ENF级环保，检测报告随便看
  - 五金终身质保，坏了一个电话24小时上门换
  - 封边用的是PUR的，泡水里都不会开
  - 安装师傅都是跟了我们5年的老师傅，不会装得歪歪扭扭
  - 做完免费上门除甲醛
  - 质保5年，终身维护

# ==================== 留资钩子池（每次随机抽 1 个用） ====================
# 每个钩子都自动带上微信号，引导客户直接加微信
lead_hooks:
  - "加我微信{{wechat_id}}，我把详细报价表发你"
  - "加我微信{{wechat_id}}，我把材料样册发你看看"
  - "加我微信{{wechat_id}}，我发你几个你们小区的业主案例"
  - "加我微信{{wechat_id}}，我让设计师给你算个精准预算"
  - "加我微信{{wechat_id}}，我把检测报告发你看看"

# ==================== 基础售后兜底信息 ====================
warranty: 十年质保、终身维保
